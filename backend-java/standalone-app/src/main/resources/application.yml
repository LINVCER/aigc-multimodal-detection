# ============================================================
# AIGC 多模态检测 · 独立 Spring Boot 配置
# ============================================================

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: paperaigc-detect

  profiles:
    active: dev

  # ---------- 数据源 ----------
  # 库名默认 ry-vue，与 deploy/.env.example 的 MYSQL_DATABASE 一致；容器里由 SPRING_DATASOURCE_* 覆盖
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ry-vue}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

  # ---------- 文件上传 ----------
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # ---------- Jackson ----------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ============================================================
# MyBatis-Plus
# ============================================================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============================================================
# 平台业务配置
# ============================================================
platform:
  inference:
    # 容器里由 compose 注入 PLATFORM_INFERENCE_HOST/PORT 覆盖（Spring 松散绑定，不需要占位符）
    host: localhost
    port: 8000                     # 与 deploy/inference-python/Dockerfile 的监听端口一致
    deadline-seconds: 10

  storage:
    # 本地文件存储根目录（LocalFileSystemStorageService 使用）
    local-path: ${STORAGE_LOCAL_PATH:./uploads}

# ============================================================
# Sa-Token（注解驱动；当前业务全用 @SaIgnore 放通，认证由业务层管理）
# ============================================================
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

# ============================================================
# 健康检查
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ============================================================
# 日志
# ============================================================
logging:
  level:
    com.paperaigc: DEBUG
    org.springframework.web: INFO
    com.baomidou.mybatisplus: INFO
