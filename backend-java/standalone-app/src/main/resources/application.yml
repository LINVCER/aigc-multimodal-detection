# ============================================================
# AIGC 多模态检测 · 独立 Spring Boot 配置
# ============================================================

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: paperaigc-detect

  profiles:
    active: dev

  # ---------- 数据源 ----------
  # 库名默认 ry-vue，与 deploy/.env.example 的 MYSQL_DATABASE 一致；容器里由 SPRING_DATASOURCE_* 覆盖
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ry-vue}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

  # ---------- 文件上传 ----------
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # ---------- Jackson ----------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ============================================================
# MyBatis-Plus
# ============================================================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============================================================
# 平台业务配置（platform.*）
# ============================================================
# 不在此处声明：platform.* 的统一默认值在
#   business-modules/ruoyi-detect/src/main/resources/platform-defaults.yml
# 由 PlatformDefaultsEnvironmentPostProcessor 在 Environment 准备阶段追加（addLast，优先级最低）。
#
# 这样做的原因：
#   1. 若依基座态（ruoyi-admin）与本 standalone 共用同一份默认值，避免两边漂移；
#   2. 原先这里写的是 platform.storage.local-path，而代码读的是 platform.storage.local-root，
#      是个不生效的死键 —— 集中到一处后由启动期统一校验。
#
# 覆盖方式：环境变量（PLATFORM_INFERENCE_HOST / PLATFORM_STORAGE_LOCAL_ROOT /
# PLATFORM_ASSISTANT_BASE_URL ...），或在本文件显式写 platform.* 覆盖默认值。
# ============================================================

# ============================================================
# Sa-Token（注解驱动；当前业务全用 @SaIgnore 放通，认证由业务层管理）
# ============================================================
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

# ============================================================
# 健康检查
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ============================================================
# 日志
# ============================================================
logging:
  level:
    com.paperaigc: DEBUG
    org.springframework.web: INFO
    com.baomidou.mybatisplus: INFO
